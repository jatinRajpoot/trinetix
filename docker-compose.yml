version: '3.8'

services:
  # ==========================================
  # Flask Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/jatinrajpoot/trinetix-backend:latest
    container_name: trinetix_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production

  # ==========================================
  # Next.js Frontend Service
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/jatinrajpoot/trinetix-frontend:latest
    container_name: trinetix_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - backend
