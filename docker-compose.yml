version: '3.8'

services:
  # ==========================================
  # Static Frontend Service (nginx serving out/)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jatinrajpoot/trinetix-frontend:latest
    container_name: trinetix_frontend
    restart: always
    ports:
      - "3000:80"
